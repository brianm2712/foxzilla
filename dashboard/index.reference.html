<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fenris · home</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Crect%20width%3D%2724%27%20height%3D%2724%27%20fill%3D%27%230b0d0f%27/%3E%3Cpath%20d%3D%27M3.5%202.5L9%208h6l5.5-5.5V11l-3%204.5L12%2021l-5.5-5.5-3-4.5z%27%20fill%3D%27none%27%20stroke%3D%27%234fd8f5%27%20stroke-width%3D%272%27%20stroke-linejoin%3D%27round%27/%3E%3Cpath%20d%3D%27M7.6%2011.6l2.8%201.5M16.4%2011.6l-2.8%201.5%27%20stroke%3D%27%23f0a030%27%20stroke-width%3D%272.6%27%20stroke-linecap%3D%27round%27/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600&amp;family=IBM+Plex+Sans:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0d0f}
a{color:#4fd8f5}a:hover{color:#e8ecef}
.tile{transition:border-color .15s ease, background .15s ease}
.tile:hover{border-color:#4fd8f5 !important;background:#1a2a32 !important}
.tile:focus-visible{outline:2px solid #4fd8f5;outline-offset:2px}
</style>

</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="min-height: 100vh; background-color: #0b0d0f; background-image: linear-gradient(rgba(232,236,239,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(232,236,239,0.035) 1px, transparent 1px); background-size: 40px 40px; color: #e8ecef; font-family: 'IBM Plex Sans', -apple-system, system-ui, sans-serif; font-size: 16px; line-height: 1.6">

<header style="height: 58px; border-bottom: 1px solid rgba(232,236,239,0.16); background: #0b0d0f">
<div style="max-width: 1280px; margin: 0 auto; height: 100%; padding: 0 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 34px; height: 34px; border: 1px solid #4fd8f5; display: flex; align-items: center; justify-content: center; color: #4fd8f5">
<svg viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Fenris" style="fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round"><path d="M3.5 2.5L9 8h6l5.5-5.5V11l-3 4.5L12 21l-5.5-5.5-3-4.5z"></path><path d="M7.6 11.6l2.8 1.5M16.4 11.6l-2.8 1.5" style="stroke: #f0a030; stroke-width: 2.2"></path></svg>
</div>
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px; letter-spacing: 3px; text-transform: uppercase">Fenris</div>
</div>
<div style="display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.98px; text-transform: uppercase; color: #8b989f">
<span id="headDot" style="width: 8px; height: 8px; border-radius: 999px; background: {{headDot}}; box-shadow: 0 0 8px {{headDot}}"></span>
<span id="headStatus">{{headStatus}}</span>
</div>
</div>
</header>

<main style="max-width: 1280px; margin: 0 auto; padding: 48px 24px 64px; box-sizing: border-box">

<section style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px">
<div style="flex: 1 1 520px; min-width: 0">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2.64px; color: #f0a030; text-transform: uppercase">// home services · tailnet only</div>
<p style="margin: 12px 0 0; color: #8b989f; max-width: 720px">HTTPS via a Let’s Encrypt wildcard on <code style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #e8ecef">*.home.prosej.com</code>, routed by the reverse proxy on <code style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #e8ecef">100.102.227.73</code>. Not reachable from the LAN. Names served by Pi-hole.</p>
</div>
<sc-if value="{{isSample}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px solid #f0a030; padding: 8px 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.98px; color: #f0a030; text-transform: uppercase">Sample status data · not live</div>
</sc-if>
</section>

<section aria-label="Overview" style="margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 20px">

<div style="background: #12252c; border: 1px solid rgba(232,236,239,0.16); padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.98px; color: #4fd8f5; text-transform: uppercase">01 · Service mix</div>
<div style="display: flex; align-items: center; gap: 20px">
<div style="position: relative; width: 128px; height: 128px; flex: none">
<svg viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="18 services by category: 7 sites, 4 infrastructure, 4 tools, 2 operations, 1 media">
<g transform="rotate(-90 64 64)">
<circle cx="64" cy="64" r="52" style="fill: none; stroke: #1a2a32; stroke-width: 14"></circle>
<sc-for list="{{donut}}" as="seg" hint-placeholder-count="5">
<circle cx="64" cy="64" r="52" style="fill: none; stroke: {{seg.color}}; stroke-width: 14; stroke-dasharray: {{seg.dash}}; stroke-dashoffset: {{seg.off}}"></circle>
</sc-for>
</g>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 500; line-height: 1">{{total}}</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1.6px; color: #8b989f; text-transform: uppercase; margin-top: 4px">services</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #8b989f; min-width: 0">
<sc-for list="{{donut}}" as="seg" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; background: {{seg.color}}; flex: none"></span><span style="flex: 1">{{seg.label}}</span><span style="font-family: 'JetBrains Mono', monospace; color: #e8ecef">{{seg.n}}</span></div>
</sc-for>
</div>
</div>
</div>

<div style="background: #12252c; border: 1px solid rgba(232,236,239,0.16); padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.98px; color: #4fd8f5; text-transform: uppercase">02 · Wildcard cert</div>
<div style="display: flex; align-items: center; gap: 20px">
<div style="position: relative; width: 128px; height: 128px; flex: none">
<svg viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Days until the next certificate renewal">
<g transform="rotate(-90 64 64)">
<circle cx="64" cy="64" r="52" style="fill: none; stroke: #1a2a32; stroke-width: 8"></circle>
<circle cx="64" cy="64" r="52" style="fill: none; stroke: {{certColor}}; stroke-width: 8; stroke-dasharray: {{certDash}}"></circle>
</g>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 500; line-height: 1">{{certDays}}</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1.6px; color: #8b989f; text-transform: uppercase; margin-top: 4px">days</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #8b989f">
<div><span style="color: #e8ecef">Next renewal</span><br>12 Nov 2026</div>
<div><span style="color: #e8ecef">Mechanism</span><br>/opt/acme/renew.sh, daily cron</div>
</div>
</div>
</div>

<div style="background: #12252c; border: 1px solid rgba(232,236,239,0.16); padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.98px; color: #4fd8f5; text-transform: uppercase">03 · Ingress path</div>
<div style="display: flex; height: 14px; gap: 2px" role="img" aria-label="13 proxied over TLS, 3 public domains, 2 direct LAN">
<div style="width: 72.2%; background: #4fd8f5"></div>
<div style="width: 16.7%; background: #e8ecef"></div>
<div style="width: 11.1%; background: #f0a030"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #8b989f">
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; background: #4fd8f5"></span><span style="flex: 1">Proxied · TLS wildcard</span><span style="font-family: 'JetBrains Mono', monospace; color: #e8ecef">13</span></div>
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; background: #e8ecef"></span><span style="flex: 1">Public · own domain</span><span style="font-family: 'JetBrains Mono', monospace; color: #e8ecef">3</span></div>
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; background: #f0a030"></span><span style="flex: 1">Direct · bypasses proxy</span><span style="font-family: 'JetBrains Mono', monospace; color: #e8ecef">2</span></div>
</div>
<div style="font-size: 12px; color: #8b989f; border-top: 1px solid rgba(232,236,239,0.16); padding-top: 10px">Direct: Pi-hole, Proxmox · Public: Jellyfin, dragonjiujitsu.com, theapostlesreliquary.com</div>
</div>

<div style="background: #12252c; border: 1px solid rgba(232,236,239,0.16); padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.98px; color: #4fd8f5; text-transform: uppercase">04 · Reachable</div>
<div style="display: flex; align-items: baseline; gap: 10px">
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 500; line-height: 1" id="upCount">{{upCount}}</div>
<div id="upLabel" style="font-size: 13px; color: #8b989f">{{upLabel}}</div>
</div>
<div style="display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); gap: 3px" role="img" aria-label="One cell per service, coloured by current state">
<sc-for list="{{flat}}" as="f" hint-placeholder-count="18">
<div class="cell" style="height: 28px; background: {{f.fill}}; border: 1px solid {{f.edge}}"></div>
</sc-for>
</div>
<div style="font-size: 12px; color: #8b989f; border-top: 1px solid rgba(232,236,239,0.16); padding-top: 10px">Probed from the Proxmox host every 15 min · any HTTP answer below 500 counts as up</div>
</div>

</section>

<section id="health" aria-label="Host health" style="margin-top: 20px; background: #12252c; border: 1px solid rgba(232,236,239,0.16); padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: baseline">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.98px; color: #4fd8f5; text-transform: uppercase">05 · Host health</div>
<a href="health/" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.98px; text-transform: uppercase; text-decoration: none">Detail →</a>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
<span id="hDot" style="width: 12px; height: 12px; border-radius: 999px; background: #8b989f"></span>
<span id="hHead" style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 500">No data</span>
<span id="hWhen" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8b989f">health/status.json not loaded</span>
<span id="hStale" hidden style="border: 1px solid #f0a030; color: #f0a030; padding: 2px 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase">stale</span>
</div>
<div>
<div id="hHist" role="img" aria-label="Last 48 hours of health runs, oldest left" style="display: grid; grid-template-columns: repeat(192, minmax(0, 1fr)); gap: 1px; height: 22px"></div>
<div style="display: flex; justify-content: space-between; margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8b989f; letter-spacing: 1px"><span>48 H AGO</span><span>NOW</span></div>
</div>
<div id="hChips" style="display: flex; flex-wrap: wrap; gap: 8px"></div>
<ul id="hProbs" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #ff8a7d"></ul>
</section>

<section id="waf" aria-label="WAF" style="margin-top: 20px; background: #12252c; border: 1px solid rgba(232,236,239,0.16); padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: baseline">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.98px; color: #4fd8f5; text-transform: uppercase">06 · WAF</div>
<a href="waf/" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.98px; text-transform: uppercase; text-decoration: none">Detail →</a>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
<span id="wDot" style="width: 12px; height: 12px; border-radius: 999px; background: #8b989f"></span>
<span id="wHead" style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 500">No data</span>
<span id="wWhen" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8b989f">waf/api/status.json not loaded</span>
<span id="wStale" hidden style="border: 1px solid #f0a030; color: #f0a030; padding: 2px 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase">stale</span>
</div>
<div>
<div id="wHist" role="img" aria-label="Events per hour, last 48 hours, oldest left" style="display: grid; grid-template-columns: repeat(48, minmax(0, 1fr)); gap: 2px; height: 22px; align-items: end"></div>
<div style="display: flex; justify-content: space-between; margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8b989f; letter-spacing: 1px"><span>48 H AGO</span><span>NOW</span></div>
</div>
<div id="wChips" style="display: flex; flex-wrap: wrap; gap: 8px"></div>
</section>


<section id="media" aria-label="Media library" style="margin-top: 20px; background: #12252c; border: 1px solid rgba(232,236,239,0.16); padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: baseline">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.98px; color: #4fd8f5; text-transform: uppercase">07 · Media library</div>
<a href="media/" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.98px; text-transform: uppercase; text-decoration: none">Detail →</a>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
<span id="mDot" style="width: 12px; height: 12px; border-radius: 999px; background: #8b989f"></span>
<span id="mHead" style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 500">No data</span>
<span id="mWhen" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8b989f">media/api/status.json not loaded</span>
</div>
<div id="mChips" style="display: flex; flex-wrap: wrap; gap: 8px"></div>

</section>

<section id="pickup" aria-label="Media pickup" style="margin-top: 20px; background: #12252c; border: 1px solid rgba(232,236,239,0.16); padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: baseline">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.98px; color: #4fd8f5; text-transform: uppercase">07b · Media pickup → NAS</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
<span id="pDot" style="width: 12px; height: 12px; border-radius: 999px; background: #8b989f"></span>
<span id="pHead" style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 500">No data</span>
<span id="pWhen" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8b989f">pickup/status.json not loaded</span>
<span id="pStale" hidden style="border: 1px solid #f0a030; color: #f0a030; padding: 2px 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase">stale — pickup not reporting</span>
</div>
<div id="pBarWrap" hidden role="progressbar" aria-label="Pickup progress" aria-valuemin="0" aria-valuemax="100" style="height: 10px; background: rgba(232,236,239,0.10)"><div id="pBar" style="height: 100%; width: 0; background: #4fd8f5; transition: width .6s"></div></div>
<div id="pMeta" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8b989f"></div>
<ul id="pQueue" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #8b989f"></ul>
</section>

<section id="siem" aria-label="AI-SIEM" style="margin-top: 20px; background: #12252c; border: 1px solid rgba(232,236,239,0.16); padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: baseline">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.98px; color: #4fd8f5; text-transform: uppercase">08 · AI-SIEM triage</div>
<a href="siem/" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.98px; text-transform: uppercase; text-decoration: none">Detail →</a>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
<span id="sDot" style="width: 12px; height: 12px; border-radius: 999px; background: #8b989f"></span>
<span id="sHead" style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 500">No data</span>
<span id="sWhen" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8b989f">siem/api/status.json not loaded</span>
</div>
<div>
<div id="sHist" role="img" aria-label="Alerts per hour, last 48 hours, oldest left" style="display: grid; grid-template-columns: repeat(48, minmax(0, 1fr)); gap: 2px; height: 22px; align-items: end"></div>
<div style="display: flex; justify-content: space-between; margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8b989f; letter-spacing: 1px"><span>48 H AGO</span><span>NOW</span></div>
</div>
<div id="sChips" style="display: flex; flex-wrap: wrap; gap: 8px"></div>
</section>
<section aria-label="Network path" style="margin-top: 20px; background: #12252c; border: 1px solid rgba(232,236,239,0.16); padding: 24px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: baseline">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1.98px; color: #4fd8f5; text-transform: uppercase">08 · How a request gets in</div>
<div style="font-size: 13px; color: #8b989f">Old *.home.arpa links 301 to the HTTPS name</div>
</div>
<div style="margin-top: 24px; display: flex; flex-wrap: wrap; align-items: stretch; gap: 0">

<div style="flex: 1 1 180px; min-width: 160px; border: 1px solid rgba(232,236,239,0.16); background: #1a2a32; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: #e8ecef; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M7 3h10v18H7zM11 18h2"></path></svg>
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 500">Tailnet device</div>
<div style="font-size: 13px; color: #8b989f">Phone, Talos, BARABUS</div>
</div>

<div style="flex: 0 1 72px; min-width: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #4fd8f5; letter-spacing: 1px">WG</div>
<div style="width: 100%; height: 2px; background: #4fd8f5"></div>
</div>

<div style="flex: 1 1 180px; min-width: 160px; border: 1px solid #4fd8f5; background: #1a2a32; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: #4fd8f5; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M6 11h12v9H6zM9 11V8a3 3 0 016 0v3"></path></svg>
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 500">revproxy · nginx</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8b989f">100.102.227.73</div>
<div style="font-size: 13px; color: #8b989f">TLS terminates here</div>
</div>

<div style="flex: 0 1 72px; min-width: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #4fd8f5; letter-spacing: 1px">HTTP</div>
<div style="width: 100%; height: 2px; background: #4fd8f5"></div>

<script>
(function(){

    var b=t.querySelector('.beats');if(b){var kids=b.children,pad=24-hist.length;

  }
  function render(st,hi){
    var svc={},hasSvc=st&&st.services;
    if(hasSvc)Object.keys(st.services).forEach(function(u){svc[norm(u)]=st.services[u];});
    var up=0,known=0;

      if(t.getAttribute('href')==='waf/'||t.getAttribute('href')==='siem/')return;   // painted from their own api/status.json   // painted from waf/api/status.json, not the host probe

        .map(function(e){var m={};Object.keys(e.svc).forEach(function(u){m[norm(u)]=e.svc[u];});return m[key];}).slice(-24);
      if(r){known++;if(r.up)up++;}

    var hd=$('headDot'),down=known-up;
    var hc=!st?GREY:stale?WARN:(!st.ok||down)?CRIT:OK;
    hd.style.background=hc;hd.style.boxShadow='0 0 8px '+hc;
    $('headStatus').textContent=!st?'No data':stale?'Stale data':(st.ok&&!down)?'All systems nominal':((st.problems.length?st.problems.length+' problem'+(st.problems.length>1?'s':''):'')+(st.problems.length&&down?' · ':'')+(down?down+' down':''));
    // health panel
    if(!st){$('hHead').textContent='No data';$('hWhen').textContent='health/status.json missing or unreadable';return;}
    var n=st.problems.length;
    $('hDot').style.background=st.ok?OK:CRIT;
    $('hHead').textContent=st.ok?'Host healthy':n+' problem'+(n>1?'s':'');
    var d=new Date(st.ts);
    $('hWhen').textContent='last run '+d.toLocaleString([], {weekday:'short',hour:'2-digit',minute:'2-digit'})+' · every 15 min';
    $('hStale').hidden=!stale;
    var hh=$('hHist');hh.innerHTML='';var list=(hi||[]).slice(-192),pad=192-list.length;
    for(var k=0;k<192;k++){var e=k<pad?null:list[k-pad],x=document.createElement('span');

<!-- pickup section: painted from pickup/status.json, written by foxzilla-pickup (~/foxzilla/pickup, Progress class) -->
<script>
(function(){
  var $=function(i){return document.getElementById(i);},OK='#5fd38a',WARN='#f0a030',GREY='#8b989f',ACC='#4fd8f5';
  var PH={hashing:'Hashing',copying:'Copying to NAS',verifying:'Verifying',committing:'Committing',remuxing:'Remuxing ISO'};
  function size(b){if(b==null)return '';var u=['B','KB','MB','GB','TB'],i=0;while(b>=1024&&i<4){b/=1024;i++;}return b.toFixed(1)+' '+u[i];}
  function dur(s){s=Math.max(0,Math.round(s));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+'h '+m+'m':m?m+'m '+x+'s':x+'s';}
  function when(t){return new Date(t*1000).toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit'});}
  function dot(c){$('pDot').style.background=c;$('pDot').style.boxShadow=c===GREY?'none':'0 0 8px '+c;}
  function render(s){
    var q=(s&&s.queue)||[],a=s&&s.active;
    $('pQueue').innerHTML='';
    if(!s){dot(GREY);$('pHead').textContent='Pickup status unavailable';$('pWhen').textContent='pickup/status.json missing or unreadable';$('pWhen').style.color=GREY;$('pBarWrap').hidden=true;$('pMeta').textContent='';$('pStale').hidden=true;return 30000;}
    var stale=s.state==='active'&&(Date.now()/1000-s.updated)>180;
    $('pStale').hidden=!stale;
    if(s.state==='active'&&a){
      var pct=a.total?Math.min(100,100*a.done/a.total):0;
      dot(stale?WARN:ACC);
      $('pHead').textContent=a.name;
      $('pWhen').textContent=(PH[a.phase]||a.phase)+' · '+pct.toFixed(1)+'%';$('pWhen').style.color=GREY;$('pWhen').title='';
      $('pBarWrap').hidden=false;$('pBarWrap').setAttribute('aria-valuenow',pct.toFixed(0));
      $('pBar').style.width=pct+'%';$('pBar').style.background=stale?GREY:ACC;
      var m=[];
      if(a.unit==='bytes'){m.push(size(a.done)+' / '+size(a.total));if(a.rate&&!stale)m.push(size(a.rate)+'/s');}
      else if(a.unit==='seconds'){m.push(dur(a.done)+' / '+dur(a.total)+' of film');if(a.rate&&!stale)m.push(a.rate.toFixed(1)+'× realtime');}
      if(a.eta_s!=null&&!stale)m.push('ETA '+dur(a.eta_s));
      if(a.files_total)m.push(a.files_done+'/'+a.files_total+' files');
      m.push('item started '+when(a.item_started));
      $('pMeta').textContent=m.join(' · ');$('pMeta').title=a.file||'';
    }else{
      var l=s.last,bad=l&&l.result==='failed';
      dot(bad?WARN:OK);
      $('pHead').textContent='Idle';
      $('pWhen').textContent=l?('last: '+l.name+' · '+(l.result==='ok'?'filed':l.result)+' '+when(l.finished)):'nothing processed yet';
      $('pWhen').style.color=bad?WARN:GREY;$('pWhen').title=(l&&l.error)||'';
      $('pBarWrap').hidden=true;$('pMeta').textContent='';
    }
    q.forEach(function(r){
      var li=document.createElement('li'),bad=/held|failed/.test(r.state)||!!r.error;
      li.textContent=r.name+(r.bytes!=null?' · '+size(r.bytes):'')+' · '+r.state;
      li.style.color=bad?WARN:GREY;if(r.error)li.title=r.error;
      $('pQueue').appendChild(li);
    });
    var st=s.staging||[];
    if(st.length){
      var sl=document.createElement('li'),tot=0,tip=[];
      st.forEach(function(r){tot+=r.bytes||0;tip.push(r.path+' ('+r.age_days+'d)');});
      sl.textContent='abandoned staging · '+st.length+' dir(s) · '+size(tot);
      sl.style.color=WARN;sl.title=tip.join('\n');
      $('pQueue').appendChild(sl);
    }
    return s.state==='active'?5000:30000;
  }
  function load(){
    fetch('pickup/status.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
      .then(function(s){var next=30000;try{next=render(s);}catch(e){console.error('pickup render',e);try{render(null);}catch(_){}}setTimeout(load,next);});
  }
  load();
})();
</script>
