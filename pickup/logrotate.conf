# Installed by pickup/deploy.sh to /etc/logrotate.d/foxzilla-pickup.
# The pickup reopens the log for every line it writes, so a plain rename
# rotation is safe (no copytruncate, no postrotate signal needed).
/srv/foxzilla-config/pickup.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
}
